archetypes:
  - archetype: ARC_observation_threshold_numeric

    semantic_question_template: >
      For patient {subject_id}, find observation {category_or_synonym | observation_display} where numeric value {value_numeric} within {lookback_clause}.

    sql_template: |
      SELECT DISTINCT
        o."subject_id",
        o."observation_id",
        o."category_code",
        o."observation_code",
        o."observation_display",
        o."value_numeric",
        o."value_text",
        o."value_unit",
        o."effective_datetime",
        o."encounter_id"
      FROM "DKU_SOLUTION_DESIGN"."SOL_DESIGN"."PREAUTHPOC_OBSERVATION" AS o
      WHERE 
        o."subject_id" = '{subject_id}'
        {optional_category_filter}
        {optional_observation_filter}
        {optional_numeric_filter}
        {optional_time_filter}

    returns: [observation_id, encounter_id, category_code, observation_code, observation_display, value_numeric, value_unit, value_text, effective_datetime]

    status_hint: >
      Found if threshold condition met. When category is expressed in natural language, map it to the canonical category_code
      or a small OR-list of equivalent category_code values. Use parentheses around OR conditions. Prefer canonical category codes
      over literal user phrasing. Ambiguous if non-numeric values or mixed units are present.

    generated_question: >
      For patient `27980ad8-77b7-5360-b211-bf4fac9c468c`, find observation `Labs` | `glucose` where numeric value `>=126` within `180 days`.

    expected_sql: |
      SELECT DISTINCT
        o."subject_id",
        o."observation_id",
        o."category_code",
        o."observation_code",
        o."observation_display",
        o."value_numeric",
        o."value_text",
        o."value_unit",
        o."effective_datetime",
        o."encounter_id"
      FROM "DKU_SOLUTION_DESIGN"."SOL_DESIGN"."PREAUTHPOC_OBSERVATION" AS o
      WHERE 
        o."subject_id" = '27980ad8-77b7-5360-b211-bf4fac9c468c'
        AND (o."category_code" = 'Labs' AND o."observation_display" ILIKE '%glucose%')
        AND o."value_numeric" >= 126
        AND o."effective_datetime" >= DATEADD('day', -180, CURRENT_DATE())
        AND o."effective_datetime" <= CURRENT_DATE()

  - archetype: ARC_qualitative_observation_result

    semantic_question_template: >
      For patient {subject_id}, find qualitative observation {category_or_synonym | observation_display} within {lookback_clause}.

    sql_template: |
      SELECT DISTINCT
        o."subject_id",
        o."observation_id",
        o."category_code",
        o."observation_code",
        o."observation_display",
        o."value_numeric",
        o."value_text",
        o."value_unit",
        o."effective_datetime",
        o."encounter_id"
      FROM "DKU_SOLUTION_DESIGN"."SOL_DESIGN"."PREAUTHPOC_OBSERVATION" AS o
      WHERE
        o."subject_id" = '{subject_id}'
        {optional_category_filter}
        {optional_observation_filter}
        {optional_time_filter}

    returns: [observation_id, encounter_id, category_code, observation_code, observation_display, value_numeric, value_unit, value_text, effective_datetime]

    status_hint: >
      Found if a matching qualitative observation exists. Prefer observation_display or canonical category filters first.
      Do not filter directly on value_text in SQL because it is free text and not normalized. Downstream reasoning should inspect returned
      value_text values to determine whether they satisfy the qualitative criterion.

    generated_question: >
      For patient `27980ad8-77b7-5360-b211-bf4fac9c468c`, find qualitative observation `Labs` | `CD20` within `10 years`.

    expected_sql: |
      SELECT DISTINCT
        o."subject_id",
        o."observation_id",
        o."category_code",
        o."observation_code",
        o."observation_display",
        o."value_numeric",
        o."value_text",
        o."value_unit",
        o."effective_datetime",
        o."encounter_id"
      FROM "DKU_SOLUTION_DESIGN"."SOL_DESIGN"."PREAUTHPOC_OBSERVATION" AS o
      WHERE
        o."subject_id" = '27980ad8-77b7-5360-b211-bf4fac9c468c'
        AND (o."category_code" = 'Labs' AND o."observation_display" ILIKE '%CD20%')
        AND o."effective_datetime" >= DATEADD('year', -10, CURRENT_DATE())
        AND o."effective_datetime" <= CURRENT_DATE()

  - archetype: ARC_dx_code_range_with_lookback

    semantic_question_template: >
      For patient {subject_id}, find diagnosis codes {ranges} within {lookback_clause}.

    sql_template: |
      SELECT
        c."condition_name",
        c."condition_code",
        c."condition_id",
        c."encounter_id",
        e."encounter_start_datetime"
      FROM "DKU_SOLUTION_DESIGN"."SOL_DESIGN"."PREAUTHPOC_CONDITION" AS c
      INNER JOIN "DKU_SOLUTION_DESIGN"."SOL_DESIGN"."PREAUTHPOC_ENCOUNTER" AS e
        ON c."encounter_id" = e."encounter_id"
        AND c."subject_id" = e."subject_id"
      WHERE
        c."subject_id" = '{subject_id}'
        {optional_range_filter}
        {optional_time_filter}

    returns: [condition_id, encounter_id, condition_code, condition_name, encounter_start_datetime]

    status_hint: >
      Found if diagnosis in requested code range exists during lookback. Expand one or more requested ranges into explicit SQL range predicates.
      Ambiguous if range semantics differ from lexical BETWEEN behavior or if multiple coding systems are mixed.

    generated_question: >
      For patient `91f25704-6153-5259-bdd7-2ca6478de14a`, find diagnosis codes `J20.0 - J21.9, J40 - J47.9` within `5 years`.

    expected_sql: |
      SELECT
        c."condition_name",
        c."condition_code",
        c."condition_id",
        c."encounter_id",
        e."encounter_start_datetime"
      FROM "DKU_SOLUTION_DESIGN"."SOL_DESIGN"."PREAUTHPOC_CONDITION" AS c
      INNER JOIN "DKU_SOLUTION_DESIGN"."SOL_DESIGN"."PREAUTHPOC_ENCOUNTER" AS e
        ON c."encounter_id" = e."encounter_id"
        AND c."subject_id" = e."subject_id"
      WHERE
        c."subject_id" = '91f25704-6153-5259-bdd7-2ca6478de14a'
        AND (c."condition_code" BETWEEN 'J20.0' AND 'J21.9' OR c."condition_code" BETWEEN 'J40' AND 'J47.9')
        AND e."encounter_start_datetime" >= DATEADD('year', -5, CURRENT_DATE())
        AND e."encounter_start_datetime" <= CURRENT_DATE()

  - archetype: ARC_demographic_age_or_gender

    semantic_question_template: >
      For patient {subject_id}, return age and gender.

    sql_template: |
      SELECT
        p."subject_id",
        p."birth_date",
        p."gender",
        DATEDIFF('year', p."birth_date", CURRENT_DATE())
          - IFF(
              DATEADD('year', DATEDIFF('year', p."birth_date", CURRENT_DATE()), p."birth_date") > CURRENT_DATE(),
              1,
              0
            ) AS "age"
      FROM "DKU_SOLUTION_DESIGN"."SOL_DESIGN"."PREAUTHPOC_PATIENT" AS p
      WHERE
        p."subject_id" = '{subject_id}'

    returns: [subject_id, birth_date, gender, age]

    status_hint: >
      Found if patient exists. Compute integer age from birth_date as of CURRENT_DATE(). Ambiguous if birth_date is missing or incomplete.

    generated_question: >
      For patient `cb70e6ae-90b1-562b-8ab0-467c65d18d5e`, return age and gender.

    expected_sql: |
      SELECT
        p."subject_id",
        p."birth_date",
        p."gender",
        DATEDIFF('year', p."birth_date", CURRENT_DATE())
          - IFF(
              DATEADD('year', DATEDIFF('year', p."birth_date", CURRENT_DATE()), p."birth_date") > CURRENT_DATE(),
              1,
              0
            ) AS "age"
      FROM "DKU_SOLUTION_DESIGN"."SOL_DESIGN"."PREAUTHPOC_PATIENT" AS p
      WHERE
        p."subject_id" = 'cb70e6ae-90b1-562b-8ab0-467c65d18d5e'

  - archetype: ARC_medication_exposure_presence

    semantic_question_template: >
      For patient {subject_id}, find medication requests matching {medication_terms_or_ndc} within {lookback_clause}.

    sql_template: |
      SELECT
        mr."medication_id",
        m."medication_name",
        mr."dosage_text",
        mr."med_request_id",
        mr."dose_unit",
        mr."encounter_id",
        mr."frequency_code",
        mr."order_datetime",
        mr."route_code",
        mr."dispense_start_datetime",
        mr."dispense_end_datetime",
        mr."dose_value",
        mr."subject_id"
      FROM "DKU_SOLUTION_DESIGN"."SOL_DESIGN"."PREAUTHPOC_MEDICATIONREQUEST" AS mr
      INNER JOIN "DKU_SOLUTION_DESIGN"."SOL_DESIGN"."PREAUTHPOC_MEDICATION" AS m
        ON mr."medication_id" = m."medication_id"
      WHERE
        mr."subject_id" = '{subject_id}'
        {optional_medication_filter}
        {optional_time_filter}

    returns: [med_request_id, medication_id, medication_name, dosage_text, dose_value, dose_unit, route_code, frequency_code, order_datetime, dispense_start_datetime, dispense_end_datetime, encounter_id]

    status_hint: >
      Found if medication request matches the requested medication term or NDC within the lookback window. Prefer canonical medication identifiers when available.
      Ambiguous if only partial text matching is possible or if medication name variants map to multiple products.

    generated_question: >
      For patient `4f773083-7f4d-5378-b839-c24ca1e15434`, find medication requests matching `methotrexate` within `10 years`.

    expected_sql: |
      SELECT
        mr."medication_id",
        m."medication_name",
        mr."dosage_text",
        mr."med_request_id",
        mr."dose_unit",
        mr."encounter_id",
        mr."frequency_code",
        mr."order_datetime",
        mr."route_code",
        mr."dispense_start_datetime",
        mr."dispense_end_datetime",
        mr."dose_value",
        mr."subject_id"
      FROM "DKU_SOLUTION_DESIGN"."SOL_DESIGN"."PREAUTHPOC_MEDICATIONREQUEST" AS mr
      INNER JOIN "DKU_SOLUTION_DESIGN"."SOL_DESIGN"."PREAUTHPOC_MEDICATION" AS m
        ON mr."medication_id" = m."medication_id"
      WHERE
        mr."subject_id" = '4f773083-7f4d-5378-b839-c24ca1e15434'
        AND m."medication_name" ILIKE '%methotrexate%'
        AND mr."order_datetime" >= DATEADD('year', -10, CURRENT_DATE())
        AND mr."order_datetime" <= CURRENT_DATE()

  - archetype: ARC_medication_trial_duration

    semantic_question_template: >
      For patient {subject_id}, find continuous/total exposure to {medication_terms} for at least {min_days} days.

    sql_template: |
      SELECT
        mr."medication_id",
        m."medication_name",
        mr."dosage_text",
        mr."med_request_id",
        mr."dose_unit",
        mr."encounter_id",
        mr."frequency_code",
        mr."order_datetime",
        mr."route_code",
        mr."dispense_start_datetime",
        mr."dispense_end_datetime",
        mr."dose_value",
        mr."subject_id"
      FROM "DKU_SOLUTION_DESIGN"."SOL_DESIGN"."PREAUTHPOC_MEDICATIONREQUEST" AS mr
      INNER JOIN "DKU_SOLUTION_DESIGN"."SOL_DESIGN"."PREAUTHPOC_MEDICATION" AS m
        ON mr."medication_id" = m."medication_id"
      WHERE
        mr."subject_id" = '{subject_id}'
        {optional_medication_filter}
      ORDER BY COALESCE(mr."dispense_start_datetime", mr."order_datetime")

    returns: [med_request_id, medication_id, medication_name, dosage_text, dose_value, dose_unit, route_code, frequency_code, order_datetime, dispense_start_datetime, dispense_end_datetime, encounter_id]

    status_hint: >
      Returns candidate medication exposure rows for downstream duration calculation. Preserve chronological ordering using dispense_start_datetime or order_datetime.
      Ambiguous because continuous or total exposure duration usually requires post-SQL interval logic unless explicitly modeled in SQL.

    generated_question: >
      For patient `4f773083-7f4d-5378-b839-c24ca1e15434`, find continuous/total exposure to `methotrexate` for at least `180` days.

    expected_sql: |
      SELECT
        mr."medication_id",
        m."medication_name",
        mr."dosage_text",
        mr."med_request_id",
        mr."dose_unit",
        mr."encounter_id",
        mr."frequency_code",
        mr."order_datetime",
        mr."route_code",
        mr."dispense_start_datetime",
        mr."dispense_end_datetime",
        mr."dose_value",
        mr."subject_id"
      FROM "DKU_SOLUTION_DESIGN"."SOL_DESIGN"."PREAUTHPOC_MEDICATIONREQUEST" AS mr
      INNER JOIN "DKU_SOLUTION_DESIGN"."SOL_DESIGN"."PREAUTHPOC_MEDICATION" AS m
        ON mr."medication_id" = m."medication_id"
      WHERE
        mr."subject_id" = '4f773083-7f4d-5378-b839-c24ca1e15434'
        AND m."medication_name" ILIKE '%methotrexate%'
      ORDER BY COALESCE(mr."dispense_start_datetime", mr."order_datetime")

  - archetype: ARC_latest_observation_snapshot

    semantic_question_template: >
      Show latest {category_or_synonym | observation_display} observations for patient {subject_id}.

    sql_template: |
      SELECT DISTINCT
        o."subject_id",
        o."observation_id",
        o."encounter_id",
        o."category_code",
        o."observation_code",
        o."category_display",
        o."observation_display",
        o."value_numeric",
        o."value_text",
        o."value_unit",
        o."effective_datetime"
      FROM "DKU_SOLUTION_DESIGN"."SOL_DESIGN"."PREAUTHPOC_OBSERVATION" AS o
      WHERE
        o."subject_id" = '{subject_id}'
        {optional_category_filter}
        {optional_observation_filter}
        AND o."effective_datetime" = (
          SELECT MAX(o2."effective_datetime")
          FROM "DKU_SOLUTION_DESIGN"."SOL_DESIGN"."PREAUTHPOC_OBSERVATION" AS o2
          WHERE
            o2."subject_id" = '{subject_id}'
            {optional_correlated_category_filter}
            {optional_correlated_observation_filter}
        )

    returns: [observation_id, encounter_id,category_code, observation_code, category_display, observation_display, value_numeric, value_text, value_unit, effective_datetime]

    status_hint: >
      Found if a latest matching observation exists. When category is expressed in natural language, map it to canonical category_code values as needed.
      Ambiguous if multiple observations share the same latest effective_datetime.

    generated_question: >
      Show latest `Vital Signs` observations for patient `0c2243d2-987b-5cbd-8eb1-170a80647693`.

    expected_sql: |
      SELECT DISTINCT
        o."subject_id",
        o."observation_id",
        o."encounter_id",
        o."category_code",
        o."observation_code",
        o."category_display",
        o."observation_display",
        o."value_numeric",
        o."value_text",
        o."value_unit",
        o."effective_datetime"
      FROM "DKU_SOLUTION_DESIGN"."SOL_DESIGN"."PREAUTHPOC_OBSERVATION" AS o
      WHERE
        o."subject_id" = '0c2243d2-987b-5cbd-8eb1-170a80647693'
        AND o."category_code" = 'Vital Signs'
        AND o."effective_datetime" = (
          SELECT MAX(o2."effective_datetime")
          FROM "DKU_SOLUTION_DESIGN"."SOL_DESIGN"."PREAUTHPOC_OBSERVATION" AS o2
          WHERE
            o2."subject_id" = '0c2243d2-987b-5cbd-8eb1-170a80647693'
            AND o2."category_code" = 'Vital Signs'
        )

  - archetype: ARC_procedure_code_presence

    semantic_question_template: >
      For patient {subject_id}, find procedure codes {procedure_codes_or_ranges} (code class {code_class}) within {lookback_clause}.

    sql_template: |
      SELECT
        p."subject_id",
        p."procedure_id",
        p."encounter_id",
        p."code_class",
        p."procedure_code",
        p."procedure_display",
        p."procedure_datestart",
        p."procedure_dateend"
      FROM "DKU_SOLUTION_DESIGN"."SOL_DESIGN"."PREAUTHPOC_PROCEDURE" AS p
      WHERE
        p."subject_id" = '{subject_id}'
        {optional_code_class_filter}
        {optional_procedure_code_filter}
        {optional_time_filter}

    returns: [procedure_id, encounter_id, code_class, procedure_code, procedure_display, procedure_datestart, procedure_dateend]

    status_hint: >
      Found if at least one procedure row matches the requested code/class/time constraints. Expand one or more requested ranges
      into explicit SQL range predicates. Ambiguous if coding class is unspecified, mixed, or if requested ranges cannot be
      represented safely with lexical BETWEEN semantics.

    generated_question: >
      For patient `0c2243d2-987b-5cbd-8eb1-170a80647693`, find procedure code `3E0G76Z` (code class `icd10`) within `5 years`.

    expected_sql: |
      SELECT
        p."subject_id",
        p."procedure_id",
        p."encounter_id",
        p."code_class",
        p."procedure_code",
        p."procedure_display",
        p."procedure_datestart",
        p."procedure_dateend"
      FROM "DKU_SOLUTION_DESIGN"."SOL_DESIGN"."PREAUTHPOC_PROCEDURE" AS p
      WHERE
        p."subject_id" = '0c2243d2-987b-5cbd-8eb1-170a80647693'
        AND p."code_class" = 'icd10'
        AND p."procedure_code" = '3E0G76Z'
        AND p."procedure_datestart" >= DATEADD('year', -5, CURRENT_DATE())
        AND p."procedure_datestart" <= CURRENT_DATE()

  - archetype: ARC_encounter_timing_or_setting

    semantic_question_template: >
      For patient {subject_id}, return encounters matching {encounter_type | service_type | priority} within {lookback_clause}.

    sql_template: |
      SELECT
        e."subject_id",
        e."encounter_id",
        e."encounter_start_datetime",
        e."encounter_end_datetime",
        e."encounter_identifier",
        e."priority_code",
        e."service_type",
        e."discharge_disposition"
      FROM "DKU_SOLUTION_DESIGN"."SOL_DESIGN"."PREAUTHPOC_ENCOUNTER" AS e
      WHERE
        e."subject_id" = '{subject_id}'
        {optional_encounter_filter}
        {optional_time_filter}

    returns: [encounter_id, encounter_start_datetime, encounter_end_datetime, encounter_identifier, priority_code, service_type, discharge_disposition]

    status_hint: >
      Found if encounter matches the requested class, type, service, or priority constraint within the lookback window. When type, service, or priority is expressed in natural language, map it to canonical category_code values as needed.
      Ambiguous if a user-facing encounter concept maps to multiple physical fields or coding systems.

    generated_question: >
      For patient `27980ad8-77b7-5360-b211-bf4fac9c468c`, return encounters matching `ed` within `180 days`.

    expected_sql: |
      SELECT
        e."subject_id",
        e."encounter_id",
        e."encounter_start_datetime",
        e."encounter_end_datetime",
        e."encounter_identifier",
        e."priority_code",
        e."service_type",
        e."discharge_disposition"
      FROM "DKU_SOLUTION_DESIGN"."SOL_DESIGN"."PREAUTHPOC_ENCOUNTER" AS e
      WHERE
        e."subject_id" = '27980ad8-77b7-5360-b211-bf4fac9c468c'
        AND e."encounter_identifier" = 'ed'
        AND e."encounter_start_datetime" >= DATEADD('day', -180, CURRENT_DATE())
        AND e."encounter_start_datetime" <= CURRENT_DATE()
